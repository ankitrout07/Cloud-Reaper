<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Reaper | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at top left, #1a1a2e, #16213e);
            color: white;
            font-family: 'Inter', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }
        @keyframes slide-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-in {
            animation: slide-in 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen p-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-4xl font-bold tracking-tight text-blue-400">CLOUD REAPER <span class="text-white text-sm font-mono bg-blue-600 px-2 py-1 rounded ml-2">v1.0</span></h1>
                <p class="text-gray-400 mt-2">Azure Infrastructure FinOps Control</p>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="runScan()" id="refreshBtn" class="glass p-3 hover:bg-white/10 transition group">
                    <svg id="refreshIcon" class="w-5 h-5 text-blue-400 group-active:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
                <button onclick="runScan()" id="scanBtn" class="bg-blue-600 hover:bg-blue-500 transition px-6 py-3 rounded-lg font-bold shadow-lg shadow-blue-900/20">
                    INITIATE SCAN
                </button>
            </div>
        </div>

        <div id="notification-feed" class="fixed bottom-6 right-6 w-80 space-y-3 z-50"></div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div class="glass p-6">
                <p class="text-gray-400 text-sm">TOTAL SAVINGS</p>
                <h2 id="savings-val" class="text-3xl font-bold text-green-400">$0.00</h2>
            </div>
            <div class="glass p-6">
                <p class="text-gray-400 text-sm">ACTIVE VMs</p>
                <h2 id="vm-count" class="text-3xl font-bold text-blue-400">0</h2>
            </div>
            <div class="glass p-6">
                <p class="text-gray-400 text-sm">ZOMBIE DISKS</p>
                <h2 id="disk-count" class="text-3xl font-bold text-red-400">0</h2>
            </div>
        </div>

        <div class="glass overflow-hidden">
            <div class="px-6 py-4 border-b border-white/10 flex flex-col md:flex-row justify-between items-center bg-white/5 gap-4">
                <h3 class="font-bold">REAP TARGETS</h3>
                <div class="relative w-full md:w-64">
                    <input type="text" id="resourceSearch" onkeyup="filterTable()" placeholder="Search resources..." 
                        class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-blue-500/50 transition">
                    <svg class="absolute right-3 top-2.5 h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
            </div>
            <table class="w-full text-left" id="reapTable">
                <thead class="bg-white/5 text-gray-400 text-xs uppercase">
                    <tr>
                        <th class="px-6 py-3">Resource Name</th>
                        <th class="px-6 py-3">Resource Group</th>
                        <th class="px-6 py-3">Type/Size</th>
                        <th class="px-6 py-3">Monthly Waste</th>
                        <th class="px-6 py-3 text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="target-list" class="divide-y divide-white/5">
                     </tbody>
            </table>
        </div>

        <!-- Rightsizing Section -->
        <div class="glass p-6 mt-12">
            <h3 class="text-xl font-bold mb-4 text-blue-400 uppercase tracking-wider">SKU RIGHTSIZING & EFFICIENCY</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="text-gray-400 text-xs uppercase border-b border-white/10">
                        <tr>
                            <th class="py-3 px-4">Resource</th>
                            <th class="py-3 px-4">Current SKU</th>
                            <th class="py-3 px-4">Performance Metrics</th>
                            <th class="py-3 px-4">Efficiency Status</th>
                            <th class="py-3 px-4">Recommendation</th>
                        </tr>
                    </thead>
                    <tbody id="efficiency-list" class="divide-y divide-white/5">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function notify(message, type = 'info') {
            const feed = document.getElementById('notification-feed');
            const id = Date.now();
            
            const colors = {
                info: 'border-blue-500 text-blue-300',
                success: 'border-green-500 text-green-300',
                warning: 'border-yellow-500 text-yellow-300',
                danger: 'border-red-500 text-red-300'
            };

            const toast = `
                <div id="toast-${id}" class="glass p-4 border-l-4 ${colors[type]} animate-slide-in shadow-2xl">
                    <div class="flex justify-between items-start">
                        <p class="text-xs font-mono">${message}</p>
                        <span class="text-[10px] opacity-50">${new Date().toLocaleTimeString()}</span>
                    </div>
                </div>
            `;
            
            feed.insertAdjacentHTML('afterbegin', toast);
            
            setTimeout(() => {
                const el = document.getElementById(`toast-${id}`);
                if(el) el.style.opacity = '0';
                setTimeout(() => el?.remove(), 500);
            }, 5000);
        }

        async function reapResource(resourceName) {
            notify(`Initiating REAP command for ${resourceName}...`, 'warning');
            await new Promise(r => setTimeout(r, 2000)); 
            notify(`Successfully deleted ${resourceName}. Savings applied.`, 'success');
            runScan();
        }

        function filterTable() {
            const input = document.getElementById("resourceSearch");
            const filter = input.value.toUpperCase();
            const table = document.getElementById("reapTable");
            const tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                const nameCol = tr[i].getElementsByTagName("td")[0];
                const rgCol = tr[i].getElementsByTagName("td")[1];
                if (nameCol || rgCol) {
                    const nameText = nameCol.textContent || nameCol.innerText;
                    const rgText = rgCol.textContent || rgCol.innerText;
                    if (nameText.toUpperCase().indexOf(filter) > -1 || rgText.toUpperCase().indexOf(filter) > -1) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
        }

        async function runScan() {
            const btn = document.getElementById('scanBtn');
            const icon = document.getElementById('refreshIcon');
            
            btn.innerText = "SCANNING...";
            btn.disabled = true;
            icon.classList.add('animate-spin');

            notify("Starting cloud resource scan...", "info");

            try {
                const response = await fetch('/api/scan');
                const data = await response.json();
                
                // Show backend events
                if (data.events) {
                    data.events.forEach(ev => notify(ev.msg, ev.type));
                }

                document.getElementById('savings-val').innerText = data.total_savings;
                document.getElementById('vm-count').innerText = data.vm_count;
                document.getElementById('disk-count').innerText = data.orphans.length;

                const list = document.getElementById('target-list');
                list.innerHTML = ''; 
                
                data.orphans.forEach(item => {
                    list.innerHTML += `
                        <tr class="hover:bg-white/5 border-l-4 border-red-500 transition">
                            <td class="px-6 py-4 font-mono text-sm">
                                <span class="bg-red-500/20 text-red-400 text-[10px] px-2 py-0.5 rounded mr-2">P1</span>
                                ${item.name}
                            </td>
                            <td class="px-6 py-4">
                                <span class="text-xs bg-blue-500/10 text-blue-300 border border-blue-500/20 px-2 py-1 rounded">
                                    ${item.rg}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-gray-400">Orphaned Disk</td>
                            <td class="px-6 py-4 text-red-400 font-bold">${item.savings}/mo</td>
                            <td class="px-6 py-4 text-right">
                                <button onclick="reapResource('${item.name}')" class="bg-red-600 px-3 py-1 rounded text-xs hover:bg-red-500 transition">REAP</button>
                            </td>
                        </tr>`;
                });

                data.idle_vms.forEach(vm => {
                    list.innerHTML += `
                        <tr class="hover:bg-white/5 border-l-4 border-yellow-500 transition">
                            <td class="px-6 py-4 font-mono text-sm">
                                <span class="bg-yellow-500/20 text-yellow-400 text-[10px] px-2 py-0.5 rounded mr-2">P2</span>
                                ${vm.name}
                            </td>
                            <td class="px-6 py-4">
                                <span class="text-xs bg-blue-500/10 text-blue-300 border border-blue-500/20 px-2 py-1 rounded">
                                    ${vm.rg}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-gray-400">Idle VM (${vm.usage}% CPU)</td>
                            <td class="px-6 py-4 text-yellow-400 font-bold">${vm.savings}/mo</td>
                            <td class="px-6 py-4 text-right">
                                <button onclick="reapResource('${vm.name}')" class="bg-yellow-600 px-3 py-1 rounded text-xs hover:bg-yellow-500 transition">INVESTIGATE</button>
                            </td>
                        </tr>`;
                });

                const efficiencyList = document.getElementById('efficiency-list');
                efficiencyList.innerHTML = '';
                if (data.utilization_report) {
                    data.utilization_report.forEach(item => {
                        efficiencyList.innerHTML += `
                            <tr class="hover:bg-white/5 border-b border-white/5 transition">
                                <td class="py-4 px-4 font-mono text-sm">${item.name}</td>
                                <td class="py-4 px-4 text-blue-300">${item.current_sku}</td>
                                <td class="py-4 px-4 text-gray-400 text-xs">${item.metrics}</td>
                                <td class="py-4 px-4">
                                    <span class="px-2 py-1 rounded text-[10px] font-bold bg-white/10 ${item.color}">
                                        ${item.status}
                                    </span>
                                </td>
                                <td class="py-4 px-4 text-sm text-gray-300">${item.recommendation}</td>
                            </tr>
                        `;
                    });
                }
                
                filterTable();

            } catch (e) {
                notify("Scan failed: " + e.message, "danger");
            } finally {
                btn.innerText = "INITIATE SCAN";
                btn.disabled = false;
                icon.classList.remove('animate-spin');
            }
        }


    </script>
</body>
</html>
