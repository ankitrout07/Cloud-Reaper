<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Reaper | Price Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0d1117;
            color: white;
            font-family: 'Inter', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
        }
        @keyframes slide-in {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-in {
            animation: slide-in 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex bg-[#0d1117]">
    <!-- Sidebar Navigation -->
    <nav id="sidebar" class="fixed left-0 top-0 h-screen w-20 hover:w-64 transition-all duration-300 glass border-r border-white/10 z-50 overflow-hidden flex flex-col items-center py-8 group">
        <div class="mb-10 text-cyan-400 font-black text-2xl tracking-tighter">CR</div>
        
        <div class="flex-1 flex flex-col gap-6 w-full px-4">
            <a href="/" class="flex items-center gap-4 p-3 rounded-xl hover:bg-white/10 transition text-gray-400">
                <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span class="text-sm font-bold opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Dashboard</span>
            </a>
            <a href="/pricing" class="flex items-center gap-4 p-3 rounded-xl bg-white/10 transition text-cyan-400">
                <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3zM12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z"/></svg>
                <span class="text-sm font-bold opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Azure Prices</span>
            </a>
            <a href="/finops" class="flex items-center gap-4 p-3 rounded-xl hover:bg-white/10 transition text-gray-400">
                <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                <span class="text-sm font-bold opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">FinOps Intelligence</span>
            </a>
        </div>

        <div class="flex flex-col items-center gap-4 mb-4">
            <div class="flex items-center gap-3 px-4 w-full">
                <div id="health-pulse" class="w-3 h-3 rounded-full bg-green-500 shadow-[0_0_10px_#22c55e] animate-pulse"></div>
                <span class="text-[10px] font-bold text-gray-500 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">GO ENGINE LIVE</span>
            </div>
            
            <button class="p-3 rounded-xl hover:bg-white/10 transition group-hover:w-full group-hover:flex group-hover:items-center group-hover:gap-4">
                <svg class="w-6 h-6 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 002.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span class="text-sm font-bold text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Settings</span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 ml-20 p-8 transition-all duration-300">
        <div class="max-w-6xl mx-auto">
            <!-- Breadcrumbs -->
            <div class="flex items-center gap-2 text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-8">
                <a href="/" class="hover:text-blue-400 transition">Home</a>
                <span>/</span>
                <span class="text-gray-300">Azure Price Catalog</span>
            </div>

            <div class="glass p-8 animate-slide-in">
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h2 class="text-2xl font-bold">Azure Resource Catalog</h2>
                        <p class="text-gray-500 text-sm mt-1">Real-time reference for cloud resource cost projection</p>
                    </div>
                    <div class="flex gap-2 bg-black/20 p-1 rounded-lg">
                        <button class="px-4 py-1 bg-blue-600 rounded-md text-xs font-bold shadow-lg shadow-blue-600/20">Hourly</button>
                        <button class="px-4 py-1 hover:bg-white/5 rounded-md text-xs transition">Monthly</button>
                    </div>
                </div>

                <div class="mb-6 relative">
                    <input type="text" id="priceSearch" onkeyup="searchPrices()" placeholder="Filter by SKU or Region..." 
                        class="w-full bg-white/5 border border-white/10 rounded-xl px-12 py-3 focus:outline-none focus:border-blue-500/50 transition">
                    <svg class="absolute left-4 top-3.5 h-5 w-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-separate border-spacing-y-2" id="priceTable">
                        <thead class="text-gray-500 text-xs uppercase sticky top-0 bg-[#0d1117]/80 backdrop-blur-md z-10">
                            <tr>
                                <th class="p-4 font-black">SKU Name</th>
                                <th class="p-4 font-black">Service</th>
                                <th class="p-4 font-black">Region</th>
                                <th class="p-4 font-black">Hourly Price</th>
                                <th class="p-4 font-black">Monthly Est.</th>
                            </tr>
                        </thead>
                        <tbody id="priceTableBody" class="space-y-2">
                            <!-- Dynamic Content -->
                            <tr>
                                <td colspan="5" class="p-12 text-center">
                                    <div class="flex flex-col items-center gap-4">
                                        <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                                        <p class="text-gray-500 font-bold animate-pulse">WAKING UP GO ENGINE...</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function fetchPrices() {
            const tbody = document.getElementById('priceTableBody');
            try {
                const response = await fetch('/api/prices');
                const data = await response.json();
                
                if (data.status === 'success' && data.prices.length > 0) {
                    tbody.innerHTML = '';
                    data.prices.forEach(item => {
                        const row = document.createElement('tr');
                        row.className = 'glass hover:bg-white/5 transition cursor-pointer group';
                        
                        const monthly = (item.retailPrice * 730).toFixed(2);
                        
                        row.innerHTML = `
                            <td class="p-4 font-mono text-blue-400 font-bold group-hover:translate-x-1 transition-transform text-xs">
                                ${item.armResourceName || item.skuName}
                            </td>
                            <td class="p-4 text-xs text-gray-400">${item.serviceName}</td>
                            <td class="p-4">
                                <span class="bg-blue-900/30 text-blue-300 px-2 py-1 rounded text-[10px] font-bold">
                                    ${item.armRegionName || 'Global'}
                                </span>
                            </td>
                            <td class="p-4 font-mono text-xs text-gray-300">$${item.retailPrice.toFixed(4)}</td>
                            <td class="p-4 font-bold text-green-400">$${monthly}/mo</td>
                        `;
                        tbody.appendChild(row);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-500">No live prices found. Ensure the Go engine is running.</td></tr>';
                }
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-400">Error: ${error.message}</td></tr>`;
            }
        }

        function searchPrices() {
            const input = document.getElementById("priceSearch");
            const filter = input.value.toUpperCase();
            const table = document.getElementById("priceTable");
            const tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                const text = tr[i].textContent || tr[i].innerText;
                tr[i].style.display = text.toUpperCase().indexOf(filter) > -1 ? "" : "none";
            }
        }

        // Initial fetch
        fetchPrices();
    </script>
</body>
</html>
