repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.4.4
  hooks:
    - id: ruff
      args: [ --fix ]
    - id: ruff-format

- repo: https://github.com/golangci/golangci-lint
  rev: v1.64.5
  hooks:
    - id: golangci-lint
      entry: bash -c 'cd src/engine-go && golangci-lint run ./...'
      pass_filenames: false
