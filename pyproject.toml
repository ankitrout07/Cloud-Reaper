[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "S", "B", "A", "COM", "C4", 
    "DTZ", "T20", "RET", "SIM", "ARG", "PTH", "ERA", "PL", "RUF"
]
ignore = [
    "D100", "D101", "D103", 
    "T201",    # Allow print for now (it's a CLI tool)
    "PLR2004", # Allow magic values (common in pricing logic)
    "COM812",  # Trailing comma (conflict with formatter sometimes)
    "E501",    # Line too long
    "A003",    # Class attribute `id` is shadowing a Python builtin
    "ERA001",  # Commented-out code
    "S311",    # Pseudo-random generators (used for testing)
    "RUF003",  # Ambiguous en-dash in comments
    "SIM105",  # contextlib.suppress
    "S110",    # try-except-pass
]

[tool.ruff.lint.isort]
known-first-party = ["reaper"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/reaper"]
python_files = "test_*.py"
addopts = "-v --cov=reaper --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
