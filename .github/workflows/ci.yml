name: Cloud-Reaper CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-validation:
    name: Python Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Code Linting (Ruff)
        run: ruff check .
        
      - name: Static Type Check (Optional)
        run: |
          # Adding a placeholder for potential future typing checks
          echo "Python environment validated."

  go-validation:
    name: Go Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: engine-go/go.sum

      - name: Tidy Dependencies
        run: |
          cd engine-go
          go mod tidy

      - name: Build Engine
        run: |
          cd engine-go
          go build -v -o reaper-engine main.go

      - name: Check Formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "❌ Go code is not formatted. Run 'go fmt ./...' to fix."
            gofmt -d .
            exit 1
          fi
        working-directory: engine-go

      - name: Go Vet
        run: |
          cd engine-go
          go vet ./...
