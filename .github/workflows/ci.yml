name: Cloud-Reaper CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Python Lint (Ruff)
        uses: astral-sh/ruff-action@v1
      - name: Type Check (Mypy)
        run: |
          pip install mypy types-PyYAML types-requests
          mypy src/reaper --ignore-missing-imports

  lint-go:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: src/engine-go/go.mod
      - name: Go Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: src/engine-go

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run Tests
        run: pytest --cov-report=xml
      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: false

  test-go:
    name: Go Tests & Build
    runs-on: ubuntu-latest
    needs: lint-go
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: src/engine-go/go.mod
      - name: Run Tests
        working-directory: src/engine-go
        run: go test -v -coverprofile=coverage.out ./...
      - name: Build Engine
        working-directory: src/engine-go
        run: go build -o reaper-engine main.go
      - name: Upload Go Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reaper-engine
          path: src/engine-go/reaper-engine
      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./src/engine-go/coverage.out
          flags: go
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r src/reaper -f json -o bandit-report.json || true
      - name: Run Safety
        run: |
          pip install safety
          safety check --file requirements.txt --output json > safety-report.json || true
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  integration:
    name: Integration Check
    runs-on: ubuntu-latest
    needs: [test-python, test-go]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloud_reaper
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Download Go Engine
        uses: actions/download-artifact@v4
        with:
          name: reaper-engine
          path: src/engine-go/
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          chmod +x src/engine-go/reaper-engine
      - name: Verify Core Wiring
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloud_reaper
        run: |
          python -c "from reaper.collectors.azure_collector import AzureCollector; from reaper.engine.calculator import CostCalculator; print('✅ Wiring OK')"
          ./src/engine-go/reaper-engine --help || true
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: |
          docker build -t cloud-reaper:latest .
      - name: Verify Docker Image
        run: |
          docker images | grep cloud-reaper

  summary:
    name: Final Summary
    runs-on: ubuntu-latest
    needs: [integration, docker-build]
    steps:
      - name: Summary
        run: |
          echo "### 🚀 Cloud-Reaper CI Successful" >> $GITHUB_STEP_SUMMARY
          echo "All checks passed. Go engine built, Docker image verified, and integration tests completed." >> $GITHUB_STEP_SUMMARY
