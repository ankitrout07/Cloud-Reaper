name: Cloud-Reaper CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    name: Python Lint & Coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Code Linting & Security Check (Ruff)
        run: ruff check --select=E,W,F,I,N,D,UP,S .

      - name: Run Python Tests with Coverage
        run: |
          pytest --cov=collectors --cov=engine --cov-report=xml --cov-report=html --cov-report=term-missing -v 2>/dev/null || \
          python -c "import collectors.azure_collector; import engine.calculator; import engine.models; print('✅ Core modules import successfully')"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: htmlcov/
          retention-days: 30
        if: always()

  go-validation:
    name: Go Lint & Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: engine-go/go.mod

      - name: Tidy & Verify Dependencies
        working-directory: ./engine-go
        run: |
          go mod tidy
          go mod verify
          go mod download

      - name: Install Tools
        run: |
          go install github.com/golangci/golangci-lint@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run GoLint
        working-directory: ./engine-go
        run: golangci-lint run ./... --timeout 5m

      - name: Check Formatting
        working-directory: ./engine-go
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "❌ Go code is not formatted"
            gofmt -d .
            exit 1
          fi

      - name: Go Vet & StaticCheck
        working-directory: ./engine-go
        run: |
          go vet ./...
          staticcheck ./...

      - name: Build Engine
        working-directory: ./engine-go
        run: go build -v -o reaper-engine main.go

      - name: Run Go Tests with Coverage
        working-directory: ./engine-go
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload Go Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./engine-go/coverage.out
          flags: go
          name: go-coverage
          fail_ci_if_error: false
        continue-on-error: true

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [python-validation, go-validation]
    strategy:
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: engine-go/go.mod

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Go Engine
        working-directory: ./engine-go
        run: |
          go mod tidy
          go build -o reaper-engine main.go

      - name: Create Test Environment
        run: |
          cat > .env << EOF
          AZURE_SUBSCRIPTION_ID=test-subscription-id
          DATABASE_URL=sqlite:///test.db
          INFLUXDB_URL=http://localhost:8086
          INFLUXDB_TOKEN=test-token
          INFLUXDB_ORG=test-org
          INFLUXDB_BUCKET=test-bucket
          EOF

      - name: Verify Go Binary
        run: |
          if [ ! -f "engine-go/reaper-engine" ]; then
            echo "❌ Go binary not found"
            exit 1
          fi
          echo "✅ Go binary built successfully"

      - name: Verify Python Imports
        run: |
          python << 'PYTHON_SCRIPT'
          import sys
          sys.path.insert(0, '.')
          
          modules = [
              'collectors.azure_collector',
              'collectors.aws_collector',
              'engine.calculator',
              'engine.models',
              'engine.scheduler'
          ]
          
          failed = []
          for module in modules:
              try:
                  __import__(module)
                  print(f'✅ {module} imported successfully')
              except ImportError as e:
                  print(f'❌ Failed to import {module}: {e}')
                  failed.append(module)
          
          if failed:
              print(f'\n❌ Failed modules: {", ".join(failed)}')
              sys.exit(1)
          else:
              print('\n✅ All Python modules imported successfully')
          PYTHON_SCRIPT

      - name: Upload Integration Test Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-logs
          path: logs/
          retention-days: 30

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit Security Scan
        run: bandit -r collectors engine ui -f json -o bandit-report.json || true

      - name: Check Dependencies
        run: safety check --file requirements.txt --output json || true

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-reports
          path: |
            bandit-report.json
          retention-days: 30
