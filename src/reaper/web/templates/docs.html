<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="/static/assets/favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Reaper | Documentation</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/js/theme.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass-morph {
            background: #12151a;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        }

        .doc-section {
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .doc-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 1rem;
        }

        .doc-header h2 {
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            color: #8baef5;
            text-transform: uppercase;
        }
    </style>
</head>

<body class="min-h-screen flex">
    {% include "_sidebar.html" %}

    <main class="app-main flex-1 p-8 lg:p-10 overflow-y-auto">
        <div class="max-w-5xl mx-auto">
            <header class="mb-10">
                <h1 class="text-4xl font-black tracking-tighter glow-text-cyan uppercase">System <span
                        class="text-cyan-400">Documentation</span></h1>
                <p class="text-gray-500 text-xs mt-2 font-bold uppercase tracking-widest">
                    Product Docs, Feature Guides, and Changelogs
                </p>
            </header>

            <!-- Premium RAG Vector Search Bar -->
            <div class="mb-8 max-w-2xl relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fas fa-search text-cyan-400"></i>
                </div>
                <input type="text" id="doc-search-input" placeholder="Search documentation contextually... (e.g. how do I fix idle compute)" 
                       class="w-full pl-10 pr-24 py-3 bg-[#161a22] border border-cyan-500/20 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition text-sm">
                <button onclick="triggerDocSearch()" class="absolute right-2 top-2 px-4 py-1.5 bg-cyan-500 hover:bg-cyan-600 text-black text-xs font-black uppercase rounded-lg transition">
                    Search
                </button>
            </div>

            <!-- RAG Search Results Panel -->
            <div id="search-results-panel" class="hidden mb-8 p-6 glass-morph border border-cyan-500/30" style="background: rgba(18, 21, 26, 0.95);">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-white/5">
                    <h3 class="text-cyan-400 text-xs font-black uppercase tracking-wider"><i class="fas fa-magic mr-2"></i> RAG Semantic Matches</h3>
                    <button onclick="closeSearchResults()" class="text-gray-500 hover:text-white transition"><i class="fas fa-times"></i></button>
                </div>
                <div id="search-results-content" class="space-y-4">
                    <!-- Dynamic Results -->
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
                <!-- Navigation Sidebar -->
                <div class="md:col-span-1 space-y-2" id="doc-nav-sidebar">
                    {% for doc in docs_data %}
                    <button onclick="showDoc('{{ doc.filename }}')" 
                            id="nav-btn-{{ doc.filename }}" 
                            class="w-full text-left block p-3.5 glass-morph {% if loop.first %}text-cyan-400 border border-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.15)]{% else %}text-gray-400 border border-white/5{% endif %} text-xs font-black uppercase tracking-wider hover:bg-white/5 hover:text-white transition-all duration-300">
                        <i class="far fa-file-alt mr-2 text-[10px] {% if loop.first %}text-cyan-400{% else %}text-gray-500{% endif %}" id="nav-icon-{{ doc.filename }}"></i>
                        {{ doc.title }}
                    </button>
                    {% endfor %}
                </div>

                <!-- Main Content -->
                <div class="md:col-span-3 space-y-8" id="doc-content-container">
                    {% for doc in docs_data %}
                    <section id="section-{{ doc.filename }}" class="glass-morph doc-section {% if not loop.first %}hidden{% endif %} transition-opacity duration-300">
                        <div class="doc-header">
                            <i class="fas fa-file-alt text-cyan-400 text-xl"></i>
                            <h2>{{ doc.title }}</h2>
                        </div>
                        <div class="prose prose-invert max-w-none text-xs text-slate-300 doc-markdown-body" data-markdown-content="{{ doc.content | escape }}">
                            <!-- Dynamic Markdown Rendered HTML goes here -->
                        </div>
                    </section>
                    {% endfor %}
                </div>
            </div>
        </div>
    </main>

    <script>
        // High-Fidelity Markdown Parser
        function parseMarkdown(md) {
            if (!md) return "";
            
            // Basic sanitization
            let html = md
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
            
            // Math blocks: $$ ... $$
            html = html.replace(/\$\$(.*?)\$\$/gs, (match, formula) => {
                const cleanFormula = formula.replace(/\\/g, "").trim();
                return `<div class="bg-black/40 p-5 rounded-2xl border border-cyan-500/10 my-6 text-center font-mono text-[11px] text-cyan-300 tracking-wider shadow-inner shadow-cyan-500/5 leading-loose">${cleanFormula}</div>`;
            });
            
            // Code blocks: ```lang ... ```
            html = html.replace(/```(?:[a-zA-Z0-9]+)?\n([\s\S]*?)\n```/g, (match, code) => {
                return `<pre class="bg-black/50 p-5 rounded-2xl border border-white/5 my-5 text-[11px] font-mono text-cyan-400 overflow-x-auto shadow-inner leading-relaxed"><code>${code}</code></pre>`;
            });
            
            // Inline code: `code`
            html = html.replace(/`([^`]+)`/g, '<code class="bg-white/5 border border-white/5 px-2 py-0.5 rounded-lg font-mono text-[10px] text-[#ff60b5]">$1</code>');
            
            // Headers
            html = html.replace(/^# (.*?)$/gm, '<h1 class="text-xl font-black text-white uppercase tracking-wider mb-6 pb-2 border-b border-white/10 mt-2">$1</h1>');
            html = html.replace(/^## (.*?)$/gm, '<h2 class="text-sm font-black text-cyan-400 uppercase tracking-widest mt-8 mb-4 flex items-center gap-2"><i class="fas fa-chevron-right text-[10px] text-cyan-500"></i> $1</h2>');
            html = html.replace(/^### (.*?)$/gm, '<h3 class="text-xs font-black text-slate-300 uppercase tracking-wider mt-6 mb-3">$1</h3>');
            
            // Lists
            html = html.replace(/^[-\*] (.*?)$/gm, '<li class="ml-4 list-disc text-slate-300 my-2 leading-relaxed">$1</li>');
            html = html.replace(/^\d+\. (.*?)$/gm, '<li class="ml-4 list-decimal text-slate-300 my-2 leading-relaxed">$1</li>');
            
            // Bold
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-bold text-white">$1</strong>');
            
            // Paragraph splits by double newlines
            const blocks = html.split(/\n{2,}/);
            html = blocks.map(block => {
                block = block.trim();
                if (!block) return "";
                if (block.startsWith("<h") || block.startsWith("<p") || block.startsWith("<div") || block.startsWith("<pre") || block.startsWith("<li")) {
                    return block;
                }
                return `<p class="mb-4 text-slate-300 leading-relaxed text-xs">${block}</p>`;
            }).join("\n");
            
            return html;
        }

        function showDoc(filename) {
            // Hide all sections
            document.querySelectorAll('#doc-content-container section').forEach(sec => {
                sec.classList.add('hidden');
            });
            // Show target section
            const activeSection = document.getElementById('section-' + filename);
            if (activeSection) {
                activeSection.classList.remove('hidden');
            }
            
            // Reset all buttons style
            document.querySelectorAll('#doc-nav-sidebar button').forEach(btn => {
                btn.className = "w-full text-left block p-3.5 glass-morph text-gray-400 border border-white/5 text-xs font-black uppercase tracking-wider hover:bg-white/5 hover:text-white transition-all duration-300";
            });
            // Reset icons style
            document.querySelectorAll('#doc-nav-sidebar i').forEach(icon => {
                icon.className = "far fa-file-alt mr-2 text-[10px] text-gray-500";
            });

            // Set active button style
            const activeBtn = document.getElementById('nav-btn-' + filename);
            if (activeBtn) {
                activeBtn.className = "w-full text-left block p-3.5 glass-morph text-cyan-400 border border-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.15)] text-xs font-black uppercase tracking-wider hover:bg-white/5 hover:text-white transition-all duration-300";
            }
            const activeIcon = document.getElementById('nav-icon-' + filename);
            if (activeIcon) {
                activeIcon.className = "far fa-file-alt mr-2 text-[10px] text-cyan-400";
            }
        }

        function showDocAndScroll(filename) {
            showDoc(filename);
            const activeSection = document.getElementById('section-' + filename);
            if (activeSection) {
                activeSection.scrollIntoView({ behavior: 'smooth' });
            }
        }

        async function triggerDocSearch() {
            const input = document.getElementById("doc-search-input");
            const query = input.value.trim();
            if (!query) return;

            const panel = document.getElementById("search-results-panel");
            const content = document.getElementById("search-results-content");

            panel.classList.remove("hidden");
            content.innerHTML = `
                <div class="flex items-center gap-2 p-4">
                    <i class="fas fa-circle-notch animate-spin text-cyan-400"></i>
                    <span class="text-xs text-gray-400 font-bold uppercase tracking-wider">Retrieving relevant context from vector index...</span>
                </div>
            `;

            try {
                const response = await fetch('/api/v1/docs/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await response.json();

                if (data.status === "success" && data.results.length > 0) {
                    let html = "";
                    data.results.forEach(res => {
                        html += `
                            <div onclick="showDocAndScroll('${res.file}')" class="p-4 bg-white/5 border border-white/5 rounded-xl space-y-2 hover:border-cyan-500/30 hover:bg-white/10 transition cursor-pointer group relative overflow-hidden">
                                <div class="absolute right-0 top-0 w-24 h-24 bg-cyan-500/5 blur-xl group-hover:bg-cyan-500/10 transition"></div>
                                <div class="flex justify-between items-center pb-1 border-b border-white/5">
                                    <span class="text-xs font-black uppercase text-cyan-400 flex items-center gap-1.5"><i class="far fa-file-alt"></i> ${res.file.replace(".md", "").replace(/^\d+_?/, "").replace(/_/g, " ").toUpperCase()}</span>
                                    <span class="px-2 py-0.5 bg-cyan-500/10 text-cyan-400 text-[9px] font-black uppercase rounded shadow-sm">${res.confidence_score} match</span>
                                </div>
                                <p class="text-xs text-slate-300 leading-relaxed font-mono">${res.content}</p>
                                <div class="text-[9px] text-gray-500 uppercase tracking-widest font-black flex items-center gap-1.5 pt-1 group-hover:text-cyan-400 transition-colors">
                                    <span>Click to navigate to section</span> <i class="fas fa-arrow-right text-[8px]"></i>
                                </div>
                            </div>
                        `;
                    });
                    content.innerHTML = html;
                } else {
                    content.innerHTML = `
                        <div class="p-4 text-center text-xs text-gray-500">
                            <i class="fas fa-search-minus text-lg mb-2 block"></i>
                            No highly relevant documentation sections found. Try matching other operational concepts.
                        </div>
                    `;
                }
            } catch (err) {
                content.innerHTML = `
                    <div class="p-4 text-center text-xs text-red-400 uppercase font-bold">
                        <i class="fas fa-exclamation-triangle mr-2"></i> Documentation vector engine unconfigured or offline.
                    </div>
                `;
            }
        }

        function closeSearchResults() {
            document.getElementById("search-results-panel").classList.add("hidden");
            document.getElementById("doc-search-input").value = "";
        }

        // Initialize and parse markdown elements on startup
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".doc-markdown-body").forEach(el => {
                const rawContent = el.getAttribute("data-markdown-content");
                el.innerHTML = parseMarkdown(rawContent);
            });

            // Add Enter key event listener to search input
            document.getElementById("doc-search-input")?.addEventListener("keypress", function(e) {
                if (e.key === "Enter") {
                    triggerDocSearch();
                }
            });
        });
    </script>
</body>

</html>
