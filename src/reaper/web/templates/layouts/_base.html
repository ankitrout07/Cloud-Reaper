<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <link rel="icon" href="/static/assets/favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Reaper</title>
    <!-- Professional Theme CSS -->
    <link rel="stylesheet" href="/static/css/professional-theme.css">
    <!-- Documentation Styles -->
    <link rel="stylesheet" href="/static/css/docs.css">
    <!-- Legacy CSS support -->
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/professional-dark.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Highlight.js for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/setup.js"></script>
    <script src="/static/js/ui-interactions.js"></script>
    <script src="/static/js/cloud-providers.js"></script>
    <script src="/static/js/vault.js"></script>
    <script src="/static/js/docs.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Marked library for rendering markdown docs -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- HTMX for SPA -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }
        .metric-value {
            font-family: 'JetBrains Mono', monospace;
        }
        .v-badge {
            background: var(--accent-subtle);
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
            padding: 2px 8px;
            border-radius: 99px;
            font-family: monospace;
            font-weight: 800;
            font-size: 10px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body class="flex">
    <!-- Sidebar Navigation -->
    {% include "layouts/_sidebar.html" %}

    <!-- Main Content Area -->
    <div id="main-content" class="flex-1 w-full h-full relative transition-all fade-in">
        {% block content %}{% endblock %}
    </div>

    <!-- SPA Re-init script -->
    <script>
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if(typeof initCharts === 'function') initCharts();
            if(typeof bindEventListeners === 'function') bindEventListeners();
            if(typeof initializeSidebarHighlighting === 'function') initializeSidebarHighlighting();
        });
    </script>
</body>
</html>
