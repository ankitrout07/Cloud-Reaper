<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <link rel="icon" href="/static/assets/favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Reaper</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/professional-dark.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/setup.js"></script>
    <script src="/static/js/ui-interactions.js"></script>
    <script src="/static/js/cloud-providers.js"></script>
    <script src="/static/js/vault.js"></script>
    <script src="/static/js/docs.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Marked library for rendering markdown docs -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- HTMX for SPA -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0b0d10;
            --bg-card: #12151a;
            --primary: #5b8def;
            --secondary: #6b7f9e;
            --success: #3d9a6a;
            --warning: #c9a227;
            --danger: #c96b6b;
            --text-main: #e4e7ec;
            --text-dim: #9ca3af;
        }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
            transition: border-color 0.2s ease, transform 0.2s ease;
        }
        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: white;
            padding: 0.75rem 1rem;
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 10px rgba(91, 141, 239, 0.2);
        }
        .tab-btn {
            position: relative;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            color: var(--primary);
            background: rgba(91, 141, 239, 0.08);
            border-left: 3px solid var(--primary);
        }
        .metric-value {
            font-family: 'JetBrains Mono', monospace;
        }
        .v-badge {
            background: rgba(91, 141, 239, 0.1);
            color: #8baef5;
            border: 1px solid rgba(91, 141, 239, 0.25);
            padding: 2px 8px;
            border-radius: 99px;
            font-family: monospace;
            font-weight: 800;
            font-size: 10px;
            letter-spacing: 1px;
        }
        @keyframes fadeIn {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
    </style>
</head>
<body class="flex">
    <!-- Sidebar Navigation -->
    {% include "layouts/_sidebar.html" %}

    <!-- Main Content Area -->
    <div id="main-content" class="flex-1 w-full h-full relative transition-all fade-in">
        {% block content %}{% endblock %}
    </div>

    <!-- SPA Re-init script -->
    <script>
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if(typeof initCharts === 'function') initCharts();
            if(typeof bindEventListeners === 'function') bindEventListeners();
            if(typeof initializeSidebarHighlighting === 'function') initializeSidebarHighlighting();
        });
    </script>
</body>
</html>
