<div class="settings-section section-icon-blue" style="border-color: rgba(59, 130, 246, 0.25); box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,0,0,0.2) inset, 0 0 40px rgba(59,130,246,0.06);">
    <div class="section-header" style="background: linear-gradient(90deg, rgba(59,130,246,0.08) 0%, rgba(59,130,246,0.03) 50%, transparent 100%); border-bottom-color: rgba(59,130,246,0.15);">
        <div class="section-title">
            <div class="section-icon">
                <i class="fas fa-cloud"></i>
            </div>
            <div>
                <h3>Cloud Providers</h3>
                <p>Connect AWS, Azure, or GCP</p>
            </div>
        </div>
    </div>
    <div class="section-content">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            <!-- AWS -->
            <div class="p-6 rounded-2xl border border-gray-700 transition-all hover:border-blue-500/30 hover:shadow-lg hover:shadow-blue-500/10" style="background: rgba(31, 41, 55, 0.5);">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-bold text-white flex items-center gap-3 text-base">
                        <span class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: rgba(255, 153, 0, 0.1); border: 1px solid rgba(255, 153, 0, 0.2);">
                            <i class="fab fa-aws" style="color: #FF9900;"></i>
                        </span>
                        AWS
                    </span>
                    <span id="cloud-status-aws" class="text-[10px] font-bold uppercase tracking-wider text-gray-500 px-3 py-1.5 rounded-full border border-gray-700" style="background: rgba(31, 41, 55, 0.5);">Disconnected</span>
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="toggleCloudPanel('aws')" class="flex-1 py-2.5 text-[10px] font-bold uppercase tracking-wider rounded-lg border border-gray-700 text-gray-400 hover:text-white transition-all" style="background: rgba(31, 41, 55, 0.3);">Configure</button>
                    <button type="button" id="cloud-switch-aws" onclick="switchSettingsProvider('aws')" class="flex-1 py-2.5 text-[10px] font-bold uppercase tracking-wider rounded-lg transition-all" style="background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3);">Activate</button>
                </div>
            </div>
            <!-- Azure -->
            <div class="p-6 rounded-2xl border border-gray-700 transition-all hover:border-blue-500/30 hover:shadow-lg hover:shadow-blue-500/10" style="background: rgba(31, 41, 55, 0.5);">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-bold text-white flex items-center gap-3 text-base">
                        <span class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: rgba(0, 120, 212, 0.1); border: 1px solid rgba(0, 120, 212, 0.2);">
                            <i class="fab fa-microsoft" style="color: #0078D4;"></i>
                        </span>
                        Azure
                    </span>
                    <span id="cloud-status-azure" class="text-[10px] font-bold uppercase tracking-wider text-gray-500 px-3 py-1.5 rounded-full border border-gray-700" style="background: rgba(31, 41, 55, 0.5);">Disconnected</span>
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="toggleCloudPanel('azure')" class="flex-1 py-2.5 text-[10px] font-bold uppercase tracking-wider rounded-lg border border-gray-700 text-gray-400 hover:text-white transition-all" style="background: rgba(31, 41, 55, 0.3);">Configure</button>
                    <button type="button" id="cloud-switch-azure" onclick="switchSettingsProvider('azure')" class="flex-1 py-2.5 text-[10px] font-bold uppercase tracking-wider rounded-lg transition-all" style="background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3);">Activate</button>
                </div>
            </div>
            <!-- GCP -->
            <div class="p-6 rounded-2xl border border-gray-700 transition-all hover:border-blue-500/30 hover:shadow-lg hover:shadow-blue-500/10" style="background: rgba(31, 41, 55, 0.5);">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-bold text-white flex items-center gap-3 text-base">
                        <span class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: rgba(66, 133, 244, 0.1); border: 1px solid rgba(66, 133, 244, 0.2);">
                            <i class="fab fa-google" style="color: #4285F4;"></i>
                        </span>
                        GCP
                    </span>
                    <span id="cloud-status-gcp" class="text-[10px] font-bold uppercase tracking-wider text-gray-500 px-3 py-1.5 rounded-full border border-gray-700" style="background: rgba(31, 41, 55, 0.5);">Disconnected</span>
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="toggleCloudPanel('gcp')" class="flex-1 py-2.5 text-[10px] font-bold uppercase tracking-wider rounded-lg border border-gray-700 text-gray-400 hover:text-white transition-all" style="background: rgba(31, 41, 55, 0.3);">Configure</button>
                    <button type="button" id="cloud-switch-gcp" onclick="switchSettingsProvider('gcp')" class="flex-1 py-2.5 text-[10px] font-bold uppercase tracking-wider rounded-lg transition-all" style="background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3);">Activate</button>
                </div>
            </div>
        </div>

        <!-- Configuration Panels -->
        <div id="cloud-panel-aws" class="cloud-provider-panel hidden p-8 rounded-2xl mt-8 space-y-6" style="background: rgba(17, 24, 39, 0.8); border: 1px solid rgba(59, 130, 246, 0.2); box-shadow: 0 0 24px rgba(59,130,246,0.06);">
            <div class="flex items-center gap-3 mb-4">
                <span class="w-2 h-2 rounded-full" style="background: #FF9900;"></span>
                <span class="text-xs font-bold uppercase tracking-widest text-gray-400">AWS Credentials</span>
            </div>
            <input id="settings-aws-access-key-id" placeholder="AWS_ACCESS_KEY_ID" class="form-input">
            <input id="settings-aws-secret-access-key" type="password" placeholder="AWS_SECRET_ACCESS_KEY" class="form-input">
            <input id="settings-aws-region" placeholder="us-east-1" class="form-input">
            <button type="button" id="settings-connect-aws" onclick="connectSettingsProvider('aws')" class="btn-primary w-full">
                Connect & Activate
            </button>
        </div>

        <div id="cloud-panel-azure" class="cloud-provider-panel hidden p-8 rounded-2xl mt-8 space-y-6" style="background: rgba(17, 24, 39, 0.8); border: 1px solid rgba(59, 130, 246, 0.2); box-shadow: 0 0 24px rgba(59,130,246,0.06);">
            <div class="flex items-center gap-3 mb-4">
                <span class="w-2 h-2 rounded-full" style="background: #0078D4;"></span>
                <span class="text-xs font-bold uppercase tracking-widest text-gray-400">Azure Service Principal</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input id="settings-azure-subscription-id" placeholder="Subscription ID" class="form-input">
                <input id="settings-azure-tenant-id" placeholder="Tenant ID" class="form-input">
                <input id="settings-azure-client-id" placeholder="Client ID" class="form-input">
                <input id="settings-azure-client-secret" type="password" placeholder="Client Secret" class="form-input">
            </div>
            <button type="button" id="settings-connect-azure" onclick="connectSettingsProvider('azure')" class="btn-primary w-full">
                Connect & Activate
            </button>
        </div>

        <div id="cloud-panel-gcp" class="cloud-provider-panel hidden p-8 rounded-2xl mt-8 space-y-6" style="background: rgba(17, 24, 39, 0.8); border: 1px solid rgba(59, 130, 246, 0.2); box-shadow: 0 0 24px rgba(59,130,246,0.06);">
            <div class="flex items-center gap-3 mb-4">
                <span class="w-2 h-2 rounded-full" style="background: #4285F4;"></span>
                <span class="text-xs font-bold uppercase tracking-widest text-gray-400">GCP Service Account</span>
            </div>
            <input id="settings-gcp-project-id" placeholder="PROJECT_ID" class="form-input">
            <label class="form-label">Service Account JSON</label>
            <input id="settings-gcp-key-file" type="file" accept=".json" class="text-sm text-gray-300">
            <button type="button" id="settings-connect-gcp" onclick="connectSettingsProvider('gcp')" class="btn-primary w-full">
                Connect & Activate
            </button>
        </div>
    </div>
</div>
