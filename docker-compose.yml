# ==============================================================================
# Cloud-Reaper Multi-Service Docker Compose Architecture
# ==============================================================================
# Usage:
#   1. Full Microservices Stack:
#        docker compose up --build
#
#   2. Standalone Single-Container (All-in-One):
#        docker compose --profile standalone up --build app-standalone
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Main Application: Python FastAPI + Socket.IO Dashboard
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cloud-reaper-app
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      # Azure Credentials
      - AZURE_SUBSCRIPTION_ID=${AZURE_SUBSCRIPTION_ID:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}

      # AI Backend & Keys
      - AI_BACKEND=${AI_BACKEND:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

      # Database (Embedded SQLite persistent storage)
      - DATABASE_URL=sqlite:////app/data/reaper.db

      # Go Microservices Network Endpoints
      - GO_BRIDGE_HOST=go-bridge
      - GO_BRIDGE_PORT=7070
      - GO_TASK_MANAGER_HOST=task-server
      - GO_TASK_MANAGER_PORT=7071
      - GO_WEBSOCKET_HOST=websocket-server
      - GO_WEBSOCKET_PORT=7072
      - GO_RATELIMITER_HOST=ratelimit-server
      - GO_RATELIMITER_PORT=7073
      - GO_RAG_HOST=rag-server
      - GO_RAG_PORT=7074
      - GO_CALCULATOR_HOST=calculator-server
      - GO_CALCULATOR_PORT=7075
      - GO_ANOMALY_HOST=anomaly-server
      - GO_ANOMALY_PORT=7076

      # Cache & Telemetry
      - REDIS_URL=redis://redis:6379/0
      - DRY_RUN_MODE=${DRY_RUN_MODE:-true}
    volumes:
      - ./data:/app/data
    depends_on:
      go-bridge:
        condition: service_healthy
      task-server:
        condition: service_healthy
      websocket-server:
        condition: service_healthy
      ratelimit-server:
        condition: service_healthy
      rag-server:
        condition: service_healthy
      calculator-server:
        condition: service_healthy
      anomaly-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reaper-net

  # ----------------------------------------------------------------------------
  # 2. Go Core Performance Engine & Scan Bridge (:7070)
  # ----------------------------------------------------------------------------
  go-bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.go
    container_name: cloud-reaper-go-bridge
    restart: unless-stopped
    command: ["reaper-engine", "--mode", "serve", "--port", "7070"]
    ports:
      - "7070:7070"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7070/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - reaper-net

  # ----------------------------------------------------------------------------
  # 3. Go Background Task Manager (:7071)
  # ----------------------------------------------------------------------------
  task-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.go
    container_name: cloud-reaper-task-server
    restart: unless-stopped
    command: ["taskserver", "-port", "7071"]
    ports:
      - "7071:7071"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7071/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - reaper-net

  # ----------------------------------------------------------------------------
  # 4. Go WebSocket Batcher & Metrics Broadcaster (:7072)
  # ----------------------------------------------------------------------------
  websocket-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.go
    container_name: cloud-reaper-websocket-server
    restart: unless-stopped
    command: ["websocketserver", "-port", "7072"]
    ports:
      - "7072:7072"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7072/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - reaper-net

  # ----------------------------------------------------------------------------
  # 5. Go Token-Bucket Rate Limiter (:7073)
  # ----------------------------------------------------------------------------
  ratelimit-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.go
    container_name: cloud-reaper-ratelimit-server
    restart: unless-stopped
    command: ["ratelimitserver", "-port", "7073"]
    ports:
      - "7073:7073"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7073/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - reaper-net

  # ----------------------------------------------------------------------------
  # 6. Go Hybrid RAG Search Engine (:7074)
  # ----------------------------------------------------------------------------
  rag-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.go
    container_name: cloud-reaper-rag-server
    restart: unless-stopped
    command: ["ragserver", "-port", "7074"]
    ports:
      - "7074:7074"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7074/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - reaper-net

  # ----------------------------------------------------------------------------
  # 7. Go Vectorized Cost Calculator (:7075)
  # ----------------------------------------------------------------------------
  calculator-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.go
    container_name: cloud-reaper-calculator-server
    restart: unless-stopped
    command: ["calculatorserver", "-port", "7075"]
    ports:
      - "7075:7075"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7075/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - reaper-net

  # ----------------------------------------------------------------------------
  # 8. Go ML Anomaly Detection Server (:7076)
  # ----------------------------------------------------------------------------
  anomaly-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.go
    container_name: cloud-reaper-anomaly-server
    restart: unless-stopped
    command: ["anomalyserver", "-port", "7076"]
    ports:
      - "7076:7076"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7076/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - reaper-net

  # ----------------------------------------------------------------------------
  # 9. Redis Cache (for RAG result caching and telemetry)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cloud-reaper-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - reaper-net

  # ----------------------------------------------------------------------------
  # 10. Standalone All-In-One Profile (Single Container Execution)
  # ----------------------------------------------------------------------------
  app-standalone:
    profiles: ["standalone"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cloud-reaper-standalone
    restart: unless-stopped
    ports:
      - "5001:5001"
      - "7070:7070"
    environment:
      - AZURE_SUBSCRIPTION_ID=${AZURE_SUBSCRIPTION_ID:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DATABASE_URL=sqlite:////app/data/reaper.db
      - GO_BRIDGE_HOST=localhost
      - GO_BRIDGE_PORT=7070
      - GO_TASK_MANAGER_HOST=localhost
      - GO_TASK_MANAGER_PORT=7071
      - GO_WEBSOCKET_HOST=localhost
      - GO_WEBSOCKET_PORT=7072
      - GO_RATELIMITER_HOST=localhost
      - GO_RATELIMITER_PORT=7073
      - GO_RAG_HOST=localhost
      - GO_RAG_PORT=7074
      - GO_CALCULATOR_HOST=localhost
      - GO_CALCULATOR_PORT=7075
      - GO_ANOMALY_HOST=localhost
      - GO_ANOMALY_PORT=7076
      - DRY_RUN_MODE=${DRY_RUN_MODE:-true}
    volumes:
      - ./data:/app/data
    networks:
      - reaper-net

networks:
  reaper-net:
    name: cloud-reaper-network
    driver: bridge

volumes:
  redis-data:
    name: cloud-reaper-redis-data
